name = "verification-flow-reviewer"
description = "Read-only review of changes to the verification subsystem. Use when edits touch `litassist/verification_chain.py`, `litassist/citation/*`, `litassist/commands/verify/`, `litassist/commands/verify_cove/`, or `litassist/prompts/verification.yaml` \u2014 these files participate in 7 of the top 8 critical flows in this codebase, so regressions here have wide blast radius. Reports affected flows, test-coverage gaps, and specific regression risks. Does not write to files."
