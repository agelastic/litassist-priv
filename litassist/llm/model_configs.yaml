# lookup: rapid case-law analysis over concatenated full-text legal judgements.
# Gemini chosen for 1M context, low hallucination rate, and configurable thinking levels.
# OpenRouter provider fallback covers transient outages.
lookup:
  model: "google/gemini-3.5-flash"
  temperature: 0.2
  top_p: 0.4
  thinking_effort: "low"
  verbosity: "low"
  enforce_citations: false
  disable_tools: true

# Lookup sub-types resolved by mode in litassist/commands/lookup/processors.py.
# IMPORTANT: whenever a new switch is added to the lookup command that should
# affect LLM parameters (a third mode beyond irac/broad, an effort tier, a
# search-depth toggle, etc.), define the corresponding lookup-<sub_type>
# entries here. Parameters do NOT live in Python -- the factory resolves
# them by command-sub_type lookup against this file.
lookup-irac:
  model: "google/gemini-3.5-flash"
  temperature: 0
  top_p: 0.1                # tight sampling for structured Issue / Rule / Application / Conclusion analysis
  thinking_effort: "low"
  verbosity: "low"
  enforce_citations: false
  disable_tools: true

