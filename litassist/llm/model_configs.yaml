---
# LLM Model Configurations for Commands
# Last updated: 13/06/2026
# NO FALLBACKS - Missing keys will raise KeyError
#
# PARAMETERS ARE NEVER TRIMMED WHEN CHANGING A CONFIG'S MODEL - ONLY ADD.
# The decoding parameters below are the per-command INTENT. Per-model
# applicability is handled downstream, in two places:
#   - litassist/llm/parameter_handler.py (+ model_profiles.py) adapts them per
#     family at call time: it maps thinking_effort, keeps/drops verbosity, and
#     drops sampling params NOT in a family's `allowed` profile (e.g.
#     temperature/top_p for the GPT-5 / o3 reasoning families and Opus 4.7/4.8);
#   - the OpenRouter-extension sampling params (min_p, top_a, repetition_penalty)
#     are NOT dropped by that layer - they are forwarded for every model and
#     OpenRouter / the provider ignores the ones it does not support.
# So when you swap the `model:` for a command, do NOT delete existing parameters:
# removing one changes the intent and gains nothing, because anything the new
# model cannot use is dropped here or ignored downstream. Only ADD parameters the
# new model needs.
#
# AFTER changing a `model:` here: run `litassist refresh` (regenerates the tracked,
# auto-generated model_capabilities.yaml for the new id - never hand-edit that file)
# and run pytest. The offline integrity tests assert every configured model is in
# model_capabilities.yaml; the pre-commit hook runs pytest only when a .py file is
# staged, so a YAML-only model swap that breaks them would otherwise commit green.

# extractfacts: deterministic structured extraction from legal documents.
# Anthropic family chosen because temperature/top_p are honoured (GPT-5 family strips them).
extractfacts:
  model: "anthropic/claude-sonnet-4.6"
  temperature: 0
  top_p: 0.15
  thinking_effort: "high"
  enforce_citations: true
  disable_tools: true

# updatefacts: mechanical merge of already-condensed source material (digest /
# extractfacts output) into the 10-heading case_facts structure. Uses the
# cheapest configured model because the work is reorganisation, not heavy
# reasoning; gemini-3.5-flash's 1M window also suits folding in several files at
# once. enforce_citations off - citations arrive pre-verified from upstream
# commands and merging must not re-trigger verification on placeholder text.
# Low temperature/top_p to keep the merge faithful to the source facts.
updatefacts:
  model: "google/gemini-3.5-flash"
  temperature: 0.2
  top_p: 0.3
  thinking_effort: "low"
  enforce_citations: false
  disable_tools: true

strategy:
  model: "anthropic/claude-opus-4.7"
  temperature: 0.7
  top_p: 0.95
  thinking_effort: "max"
  verbosity: "medium"
  enforce_citations: false
  disable_tools: true

strategy-analysis:
  model: "openai/o3-pro"
  temperature: 0.7
  top_p: 0.95
  thinking_effort: "max"
