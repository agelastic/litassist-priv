---
capabilities:
  # USED BY: litassist/commands/caseplan/plan_generator.py:57 - Injected into the caseplan full-plan system prompt as the `litassist_capabilities` template variable so the LLM only recommends real commands and flags.
  litassist_capabilities: |
    # LitAssist Command Reference

    ## CRITICAL INSTRUCTION
    Use ONLY the exact command syntax and options listed below. Never invent or hallucinate command options. If unsure, use the simplest form.

    ## Available Commands

    ### lookup - Rapid Case Law Research Engine
    Purpose: Searches Australian case law via Jade.io and AustLII for precedents, principles, and citations
    Inputs: A SHORT, focused legal question (target ~80 chars, hard ceiling ~150 chars). Treat it like a Google search box: name the doctrine + jurisdiction + key statute or term. Do NOT keyword-stuff (a long bag of nouns scores worse on CSE than a focused phrase). Do NOT paste case narratives into the question; case-specific facts (parties, amounts, dates, invoice numbers) belong in `--guidance`, which is LLM-only and never reaches the CSE query.
    Outputs: IRAC-structured analysis or broad research report with verified citations
    Strategic Use: Foundation for all legal arguments; use early and often for authority
    Options:
      --mode: irac, broad | Choose structured IRAC analysis or broader exploratory format
      --comprehensive: (flag) | Comprehensive mode yields up to 10 results each from Jade, AustLII, and a secondary CSE (standard yields up to 5 each from Jade and AustLII)
      --extract: citations, principles, checklist | Format output for specific workflows (court briefs/advice/preparation)
      --context: [string] | SHORT search-side hint (target ~60 chars, hard ceiling ~150 chars). Concatenated verbatim to the CSE query under --comprehensive (`question + " " + context`) AND wrapped in a SEARCH CONTEXT block in the LLM prompt. Use it to NAME the jurisdiction or sub-topic (e.g. "NSW solicitor costs dispute"). NEVER embed case-specific facts (party names, amounts, dates, invoice numbers) -- those go in `--guidance`.
      --guidance: [string] | LONG LLM-only case narrative. Wrapped in a USER GUIDANCE block above the analysis prompt. NEVER touches the CSE query. This is where case-specific facts belong (parties, amounts, dates, invoice numbers, claims and counter-claims). Pair with --context: --context is the search-engine handle; --guidance is the LLM's case briefing.
      --output: [string] | Custom filename prefix for output files
      --no-fetch: (flag) | Skip content fetching, use URLs only
      --verify: (flag) | Not supported - lookup results are not verified. Use `litassist verify` for verification.
      --noverify: (flag) | Not supported - lookup has no internal verification.
    Best Practices:
      - Keep the question SHORT and focused: name the doctrine, key statute, and jurisdiction. Never embed case-specific facts (party names, amounts, dates, invoice numbers).
      - For real case work, emit BOTH `--context "<short topic label>"` AND `--guidance "<full case narrative>"`. The short context keeps the Google CSE happy; the long guidance gives the LLM the case detail it needs to answer accurately.
      - Use --comprehensive for novel legal issues requiring extensive authority -- under --comprehensive, --context joins the CSE query verbatim, so still keep --context short.
      - Use --extract citations when preparing court documents
      - Combine multiple related queries for complete coverage (10-15 for standard cases). Split one giant question into several focused ones.
      - Be specific with terminology to improve Jade.io search results
    Integration: Feeds into brainstorm --research, counselnotes synthesis, barbrief --research
    Cost: ~$0.50-2.00 per search (high ROI - authoritative citations)
    Example (GOOD - split fields): litassist lookup "Legal Profession Uniform Law s 178 disclosure non-compliance" --mode irac --comprehensive --context "NSW solicitor costs dispute" --guidance "Client seeks write-off of invoice 372763 on basis that revised estimate on 3 March 2026 did not comply with s 174; total fees approximately AUD 113,000 for a AUD 25,000 asset claim settled without recovery" --output "research_lpul_s178"
    Anti-example (DO NOT produce -- keyword-stuffed question + case-narrative crammed into --context degrades CSE recall): litassist lookup "Legal Profession Uniform Law s 178 consequences non-compliance disclosure costs agreement void assessment reduction" --mode irac --context "NSW solicitor costs dispute; client seeks write-off of invoice 372763 on basis that revised estimate on 3 March 2026 did not comply with s 174; also argues costs are not fair and reasonable under s 172 given total fees of approximately AUD 113,000 for a AUD 25,000 asset claim settled without recovery"

    ### digest - Document Intelligence Processor
    Purpose: Extracts key facts, issues, and evidence from large document sets
    Syntax: litassist digest FILE [FILE...] [options] (FILE arguments support glob patterns)
    Inputs: Multiple PDFs, text files, images (contracts, statements, evidence)
    Outputs: Structured summaries or issue-spotting reports with key findings
    Strategic Use: Critical for discovering hidden facts and strengthening case_facts.md
    Options:
      --mode: summary, issues | Choose chronological summary or legal issue-spotting analysis
      --context: [string] | Additional context to guide the analysis (e.g., "analyze financial discrepancies in bank statements", "identify timeline conflicts in witness statements")
      --output: [string] | Custom filename prefix for output files
      --verify: (flag) | Not supported - digest summaries are not verified. Use `litassist verify` for verification.
      --noverify: (flag) | Not supported - digest has no internal verification.
    Best Practices:
      - Use --mode issues with --context for targeted fact discovery
      - Process related documents together for contextual understanding
      - Follow with 'updatefacts' to fold findings into case_facts.md (or update manually)
      - Group documents logically (financial, correspondence, legal)
    Integration: Fold findings into case_facts.md with 'updatefacts' (or manually) before brainstorm/strategy
    Cost: ~$1-3 per set (saves hours of manual review)
    Example: litassist digest "Bank Statements/*.pdf" "Emails/*.pdf" --mode issues --context "trace financial contributions and their impact on ownership claims"

    ### extractfacts - Structured Fact Organizer
    Purpose: Converts raw documents into structured 10-heading case facts format
    Syntax: litassist extractfacts FILE [FILE...] [options] (FILE arguments support glob patterns)
    Inputs: Source documents (witness statements, affidavits, chronologies) - NOT case_facts.md
    Outputs: Structured 10-heading facts saved as outputs/extractfacts_*.md; run 'updatefacts' on it to produce the downstream-ready case_facts file
    Strategic Use: Essential first step - creates foundation for all downstream analysis
    Options:
      --heavy: (flag) | Use verification-heavy mode (max thinking effort)
      --noverify: (flag) | Skip verification stage (not recommended for legal work)
      --output: [string] | Custom filename prefix for output files
    Best Practices:
      - Process primary evidence documents first
      - Run iteratively as new documents arrive
      - Combine with digest for comprehensive fact gathering
      - NEVER use case_facts.md as input (it's the output!)
    Integration: Feed the output to 'updatefacts' to build case_facts; brainstorm, strategy, draft, barbrief then pick it up automatically
    Limit: <1MB per file
    Cost: ~$1-2 (prevents errors in all subsequent phases)
    Example: litassist extractfacts witness_statement.pdf police_report.pdf medical_records.pdf

    ### updatefacts - Case Facts Merger
    Purpose: Folds source documents (digest/extractfacts output or any text) into the 10-heading case_facts format, updating an existing file or creating one
    Syntax: litassist updatefacts SOURCE [SOURCE...] [--facts FILE] (SOURCE arguments support glob patterns)
    Inputs: Source documents to merge in; optional --facts existing case-facts file (defaults to the latest case_facts*.md in the current directory)
    Outputs: A fresh, auto-discoverable case_facts_<timestamp>.md in the current directory, with the 10 headings plus a Notes section for overflow
    Strategic Use: Removes manual copy-paste when assembling case facts from digest/extractfacts results; safe to re-run as new material arrives
    Options:
      --facts: [file] | Existing case facts file to update (default: latest case_facts*.md; created from scratch if none)
    Best Practices:
      - Feed it condensed material (digest or extractfacts output) rather than raw bundles
      - Re-run as new documents are processed; each run writes a new timestamped file
    Integration: Output is picked up automatically by brainstorm, strategy, draft, barbrief
    Cost: ~$0.10-0.30 (cheap merge model)
    Example: litassist updatefacts 'outputs/digest_issues_*.md' 'outputs/extractfacts_*.md'

    ### brainstorm - Creative Strategy Generator
    Purpose: Generates 20+ legal strategies (10 orthodox, 10 unorthodox) using Grok's creativity
    Syntax: litassist brainstorm --side SIDE --area AREA [options]
    Inputs: Structured case_facts.md (required), optional research reports
    Outputs: Comprehensive strategy options with risk assessments and implementation notes
    Strategic Use: Explores full range of possibilities before committing to approach
    Options:
      --side: plaintiff, defendant, accused, respondent, complainant (REQUIRED) | Specify which party you represent (complainant = regulatory/FOI complaints)
      --area: criminal, civil, family, commercial, administrative (REQUIRED) | Define the legal jurisdiction/area
      --facts: [file(s)] | Structured case facts file(s) to analyze (default: case_facts.md, supports glob)
      --research: [file(s)] | Include lookup reports for precedent-backed strategies (supports glob)
      --verify: (flag) | Add LLM content verification for legal accuracy. Recommended for final versions; citations are always verified regardless.
      --output: [string] | Custom filename prefix for output files
    Best Practices:
      - Always run WITHOUT research first (creative freedom)
      - Then run WITH research (precedent-backed strategies)
      - Consider both plaintiff and defendant perspectives
      - Review unorthodox strategies for negotiation leverage
    Integration: Feeds directly into strategy command and counselnotes synthesis
    Cost: ~$3-5 (can reveal game-changing strategies)
    Example: litassist brainstorm --side plaintiff --area civil --facts case_facts.md --research 'outputs/lookup_*.md'

    ### strategy - Tactical Implementation Planner
    Purpose: Converts broad strategies into detailed, actionable legal plans with timelines
    Syntax: litassist strategy [FACTS] --outcome "goal" [options]
    Inputs: case_facts.md plus single outcome objective
    Outputs: 3-5 detailed implementation paths with success probabilities
    Strategic Use: Bridges gap between ideas and execution; essential for case planning
    Options:
      --outcome: [string] (REQUIRED) | Single sentence describing the specific legal outcome to achieve
      --strategies: [file or glob, repeatable] | Brainstorm output to inform tactical planning; pass ONCE PER set (e.g. --strategies 'outputs/brainstorm_creative_*.md' --strategies 'outputs/brainstorm_research_*.md') and each flag resolves to the most recent match of its own pattern
      --heavy: (flag) | Use verification-heavy mode (max thinking effort)
      --noverify: (flag) | Skip verification stage (not recommended for legal work)
      --output: [string] | Custom filename prefix for output files
    Best Practices:
      - Run separately for each major objective
      - Pass both brainstorm sets (creative AND research) with a --strategies flag each
      - Generate multiple versions for comparison
      - Be specific with outcome descriptions
    Integration: Outputs guide draft command and inform final memoranda
    Cost: ~$2-4 (provides clear roadmap, prevents tactical errors)
    Example: litassist strategy case_facts.md --outcome "Establish a resulting trust over the disputed vehicle" --strategies 'outputs/brainstorm_creative_*.md' --strategies 'outputs/brainstorm_research_*.md'

    ### counselnotes - Multi-Document Strategic Synthesizer
    Purpose: Synthesizes multiple documents/analyses into cohesive strategic assessment
    Syntax: litassist counselnotes FILE [FILE...] [options] (FILE arguments support glob patterns)
    Inputs: Any combination of documents, research, strategies, briefs
    Outputs: High-level strategic analysis with practical recommendations
    Strategic Use: CRITICAL for synthesis - transforms information into actionable intelligence
    Options:
      --extract: all, citations, principles, checklist | Generate structured JSON output for workflows
      --matter-type: civil, criminal, family, commercial, disciplinary, foi, administrative | Posture framing (counselnotes has no case_facts to read it from); defaults to civil with a warning if omitted
      --verify: (flag) | Enable real-time citation verification against Jade.io database
      --output: [string] | Custom filename prefix for output files (default: counselnotes)
    Best Practices:
      - Use after accumulating 5+ source documents
      - Combine different types (research + strategies + evidence)
      - Use --extract all for comprehensive structured output
      - Run multiple times with different document combinations
      - Essential for creating feasibility memoranda
    Integration: Primary tool for creating final memoranda and feasibility assessments
    Cost: ~$2-4 (multiplies value of all prior research through synthesis)
    Example: litassist counselnotes outputs/lookup_*.md outputs/brainstorm_*.md outputs/digest_*.md --extract all

    ### barbrief - Barrister Brief Compiler
    Purpose: Creates comprehensive 10-section briefs for counsel with all case materials
    Syntax: litassist barbrief [FACTS] --hearing-type TYPE [options]
    Inputs: case_facts.md, strategies, research, supporting documents
    Outputs: Professional brief with indexed materials and strategic guidance
    Strategic Use: Essential when briefing counsel for court appearances
    Options:
      --hearing-type: trial, directions, interlocutory, appeal (REQUIRED) | Specify the type of court hearing
      --strategies: [file(s)] | Include brainstorm outputs for strategic foundation (supports glob)
      --research: [file(s)] | Include lookup reports for legal authority (supports glob)
      --documents: [file(s)] | Include supporting evidence and materials (supports glob)
      --context: [string] | Additional context to guide the analysis
      --verify: (flag) | Enable citation verification for all included authorities
      --output: [string] | Custom filename prefix for output files
    Best Practices:
      - Include ALL relevant materials using glob patterns
      - Provide specific --context for hearing focus
      - Always use --verify for citation accuracy
      - Consolidates months of work into single document
    Integration: Culmination of all prior work into single counsel document
    Cost: ~$4-8 (ensures counsel fully prepared, reduces conference time)
    Example: litassist barbrief case_facts.md --strategies 'outputs/brainstorm_*.md' --research 'outputs/lookup_*.md' --hearing-type trial --verify

    ### draft - Precision Legal Document Creator
    Purpose: Generates litigation documents, correspondence, and memoranda with citations
    Syntax: litassist draft FILE [FILE...] "description" [options] (FILE arguments support glob patterns)
    Inputs: Multiple source documents plus specific drafting instruction
    Outputs: Publication-ready legal documents with verified citations
    Strategic Use: Transforms strategy into concrete legal documents
    Options:
      --noverify: (flag) | Skip verification stage (not recommended for legal work)
      --heavy: (flag) | Use verification-heavy mode (max thinking effort)
      --output: [string] | Custom filename prefix for output files
    Best Practices:
      - Include all relevant source materials
      - Be specific in drafting instructions
      - Verification runs by default; omit --noverify for court documents
      - Run `litassist digest --mode summary <file>` first on oversize inputs
      - Essential for feasibility memoranda and recommendations
    Integration: Final step converting analysis into deliverables
    Cost: ~$2-5 (produces documents that would take hours manually)
    Example: litassist draft case_facts.md outputs/counselnotes_*.md outputs/strategy_*.md "Draft a comprehensive feasibility memorandum analyzing all available property recovery options with risk assessments"

    ### caseplan - Litigation Workflow Generator
    Purpose: Analyzes case complexity and generates phased workflow plans tailored to case needs
    Syntax: litassist caseplan [FACTS] [options]
    Inputs: Structured case_facts.md file (can be preliminary/skeleton)
    Outputs: Comprehensive litigation plan with phases, costs, timelines, and command sequences
    Strategic Use: Essential first step - generates roadmap before investing in analysis
    Options:
      --context: [string] | Additional context to guide the analysis (e.g., "property dispute")
      --budget: minimal, standard, comprehensive | Set resource constraints (if omitted, LLM recommends)
      --output: [string] | Custom filename prefix for output files
      --verify: (flag) | Not supported - shows warning message
      --noverify: (flag) | Not supported - shows warning message
    Best Practices:
      - Run early with basic case_facts.md to guide document collection
      - Without --budget: Get rapid assessment and recommendation
      - With --budget: Get full implementation plan
      - Re-run as case develops with enhanced facts
    Integration: Provides complete command sequences for systematic case development
    Cost: ~$1-2 for assessment, ~$3-5 for full plan
    Example: litassist caseplan case_facts.md --context "custody arrangements" --budget standard

    ### verify - Quality Assurance System
    Purpose: Post-hoc verification of citations, legal soundness, and reasoning
    Syntax: litassist verify FILE [options]
    Inputs: Any generated legal document
    Outputs: Verification report with corrections and confidence assessments
    Strategic Use: Critical for high-stakes documents before filing/service
    Options:
      --citations: (flag) | Verify only case citations and legislative references against Jade.io
      --soundness: (flag) | Check only legal reasoning and argument validity
      --reasoning: (flag) | Generate only structured reasoning traces for accountability
      --cove: (flag) | Add Chain of Verification as final check
      --reference: [string] | Glob pattern for reference files to include as context (e.g. '*.txt', 'docs/*.pdf'). Supports PDF and text files.
      --cove-reference: [string] | Glob pattern for reference files to include in the CoVe answer stage (requires --cove)
      --heavy: (flag) | Use verification-heavy mode (max thinking effort for reasoning and soundness stages)
      --output: [string] | Custom filename prefix for output files
      # --cross-check (multi-model ensemble) is intentionally omitted here until the
      # P1-12 measurement gate passes: caseplan generates verify commands from this
      # block, and we do not want it emitting an extra three-model panel + arbiter
      # (incl. o3-pro) into client cost plans for a still-gated feature.
    Best Practices:
      - Always verify court documents and formal correspondence
      - Use --citations for research-heavy documents
      - Use --soundness for novel legal arguments
      - Default (no flags) performs all three verifications
    Integration: Final quality gate before document release
    Cost: ~$1-2 (prevents embarrassing errors, strengthens credibility)
    Example: litassist verify outputs/draft_memorandum_*.md --citations --soundness

    ### verify-cove - Chain of Verification Document Regenerator
    Purpose: Standalone Chain of Verification pass over an existing document; regenerates the document by drafting CoVe questions and answering them against the original (and optional reference) context
    Syntax: litassist verify-cove FILE [options]
    Inputs: Any generated legal document
    Outputs: Regenerated document plus a CoVe report listing question/answer pairs
    Strategic Use: Tighten an already-drafted document before filing; complementary to `litassist verify --cove` (use this when you only need the CoVe pass, not citation/soundness verification)
    Options:
      --reference: [string] | Glob pattern for reference files to include in the CoVe answer stage (e.g. 'exhibits/*.pdf', 'affidavits/*.txt')
      --heavy: (flag) | Use verification-heavy mode (max thinking effort for the answers stage)
      --output: [string] | Custom filename prefix for output files
    Best Practices:
      - Pair with --reference when the original document depends on documents not in its body
      - Use --heavy for high-stakes documents (court filings, formal advices)
      - Run after `litassist verify` for layered quality assurance
    Integration: Polish step between draft / counselnotes and final filing
    Cost: ~$1-3 (proportional to document length and reference set)
    Example: litassist verify-cove outputs/draft_memorandum.md --reference 'exhibits/*.pdf' --heavy

    ### test - API Connectivity Checker
    Purpose: Validates all API credentials and service connectivity before starting work
    Syntax: litassist test
    Inputs: None (uses configured API keys)
    Outputs: Success/failure report for each service with detailed error messages
    Strategic Use: Run before starting new matters to ensure all services operational
    Options: None
    Best Practices:
      - Run after initial setup to verify configuration
      - Run if experiencing unexpected errors
      - Checks OpenRouter and Google CSE (OpenRouter is the sole LLM gateway; BYOK for models like openai/o3-pro is configured at https://openrouter.ai/settings/integrations)
    Integration: Standalone diagnostic tool
    Cost: Minimal (~$0.01 in API test calls)
    Example: litassist test

    ### refresh - Model Capability Cache Updater (Administrative)
    Purpose: Refresh `litassist/llm/model_capabilities.yaml` with the latest per-model context window, prices, and supported parameters from OpenRouter's `/api/v1/models` endpoint
    Syntax: litassist refresh
    Inputs: None (reads `litassist/llm/model_configs.yaml`, fetches OpenRouter live)
    Outputs: Overwrites `litassist/llm/model_capabilities.yaml` deterministically (sorted, dated header)
    Strategic Use: ADMINISTRATIVE - not part of a litigation workflow. Run only after swapping a model in `model_configs.yaml` or when OpenRouter announces pricing / context-window changes. Do NOT include in a caseplan output.
    Options: None
    Integration: Standalone admin tool; the caseplan LLM should never recommend this in a phased plan.
    Cost: Free (catalogue endpoint is unauthenticated)
    Example: litassist refresh

    ## Command Selection Principles for Comprehensive Planning

    1. Information Superiority: Use 10-15 lookup queries for standard cases, 15-25 for complex
    2. Avoid circular operations: Never extractfacts from case_facts.md or generated content
    3. Synthesis is Key: Multiple counselnotes passes with different document combinations
    4. Dual Brainstorm Approach: Always run with AND without research for perspective
    5. One strategy per outcome: Generate separate tactical plans for each objective
    6. Quote glob patterns AND multi-word values: quote glob patterns like 'outputs/*.md', and wrap any multi-word option value or instruction in double quotes (--outcome "...", --context "...", --guidance "...", draft "...") - generated commands are tokenised with shell-style splitting.
    7. Build Toward Memoranda: Every phase should contribute to final feasibility assessment
    8. Iterative Enhancement: Fold digest/extractfacts discoveries into case_facts.md with updatefacts
    9. Verify High-Stakes Documents: Always use verify for court documents and memoranda
    10. Cost-Benefit Focus: Each command should advance case understanding significantly
