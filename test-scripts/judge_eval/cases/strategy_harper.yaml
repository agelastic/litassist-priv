# P-JUDGE benchmark case: strategy (strategic options) output for the Harper
# matter. Generated 11/06/2026 by:
#   litassist strategy outputs/judge_fixture_extractfacts_*.md --outcome
#   "Recover damages for personal injury and economic loss from the
#   adventure park operator" (anthropic/claude-opus-4.7 + verification).
# SOURCES = the case_facts document strategy ran on (the extractfacts
# fixture output). Benchmark note: most authorities below were introduced
# from model knowledge, not from SOURCES - expect low grounding_coverage;
# that is the context-starvation measurement, not a fixture defect. No
# structure dimension: the strategy options format has no live named
# contract in formats.yaml (formats.strategic_options is marked NOT USED).
---
case_id: strategy_harper
command: strategy
dimensions:
  - citation_grounding
  - australian_english
  - faithfulness
  - aglc_format
output_file: strategy_harper.output.md
source_files:
  - extractfacts_harper.output.md
