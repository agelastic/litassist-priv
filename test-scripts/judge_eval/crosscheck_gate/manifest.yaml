---
# P1-12 cross-check measurement gate - seeded defect manifest.
# 4 Harper-benchmark variants, 5 documented defects each (20 total). Each defect
# is scored DETECTED for an arm iff the arm's saved reports explicitly identify it
# per detection_criterion. Scoring is deterministic (by inspection), no LLM judge.
# Frozen before any cross-check run.
#
# classes: confab (confabulated/nonexistent citation); wrongprop (real cite for a
# wrong proposition); jurisdiction (wrong-jurisdiction statute/court); contradiction
# (internal inconsistency); fabricated (fact not in the source brief).

draft_harper:
  variant: variants/draft_harper.variant.md
  defects:
    - id: D1
      class: jurisdiction
      detail: "Breach assessed under the Wrongs Act 1958 (Vic) s 48 in a NSW matter (should be Civil Liability Act 2002 (NSW) s 5B)."
      detection_criterion: "Flags the Victorian statute / wrong jurisdiction for the breach standard."
    - id: D2
      class: confab
      detail: "Henderson v Wollongong Leisure Pty Ltd [2019] NSWCA 211 - nonexistent case."
      detection_criterion: "Flags Henderson v Wollongong Leisure as unverifiable/likely fabricated."
    - id: D3
      class: wrongprop
      detail: "March v Stramare (1991) 171 CLR 506 (a causation case) cited as governing the measure of non-economic loss."
      detection_criterion: "Flags March v Stramare as misapplied / wrong proposition (it concerns causation, not damages measure)."
    - id: D4
      class: fabricated
      detail: "Dr Helena Voss certifying a second procedure in 2027 at AU$48,000 - not in the brief."
      detection_criterion: "Flags the Dr Voss / AU$48,000 future-surgery specifics as unsupported by the source."
    - id: D5
      class: contradiction
      detail: "Strategic reasoning says quantum limited to known expenses ($26,500) while para 9(b) states approximately AU$14,800 to date."
      detection_criterion: "Flags the $26,500 vs $14,800 quantum inconsistency."

strategy_harper:
  variant: variants/strategy_harper.variant.md
  defects:
    - id: S1
      class: confab
      detail: "Thompson v Blue Mountains Adventure Co [2018] NSWSC 1442 - nonexistent case."
      detection_criterion: "Flags Thompson v Blue Mountains Adventure Co as unverifiable/likely fabricated."
    - id: S2
      class: wrongprop
      detail: "Oceanic Sun Line v Fay (1988) 165 CLR 197 (forum/ticket case) cited as establishing s 5L does not apply to commercial operators."
      detection_criterion: "Flags Oceanic Sun Line as misapplied for the s 5L proposition."
    - id: S3
      class: jurisdiction
      detail: "Preliminary discovery cited under County Court Civil Procedure Rules 2018 (Vic) r 5.3 in a NSW matter (should be UCPR 2005 (NSW))."
      detection_criterion: "Flags the Victorian court rules / wrong jurisdiction for preliminary discovery."
    - id: S4
      class: contradiction
      detail: "Option 5 limitation expiry stated as 22/02/2028 while the same reasoning derives it from a 22/02/2026 accident (i.e. 2029)."
      detection_criterion: "Flags the limitation date inconsistency (2028 vs the 3-year-from-2026 basis)."
    - id: S5
      class: fabricated
      detail: "Allianz Australia having confidentially reserved $750,000 - not in the brief."
      detection_criterion: "Flags the Allianz $750,000 reserve as unsupported by the source."

lookup_harper:
  variant: variants/lookup_harper.variant.md
  pre_existing_not_scored:
    - "Falvo v Oztag Queensland Inc [2006] HCA 16 (confabulated, present in the original fixture)."
    - "Action Paintball Games Pty Ltd v Barker (uncited, present in the original fixture)."
  defects:
    - id: L1
      class: confab
      detail: "Spencer v Treetops Adventure Pty Ltd [2021] NSWCA 88 - nonexistent case."
      detection_criterion: "Flags Spencer v Treetops Adventure as unverifiable/likely fabricated."
    - id: L2
      class: wrongprop
      detail: "Wyong Shire Council v Shirt (1980) 146 CLR 40 (breach/foreseeability calculus) cited as settling the definition of dangerous recreational activity."
      detection_criterion: "Flags Wyong v Shirt as misapplied for the dangerous-recreational-activity definition."
    - id: L3
      class: jurisdiction
      detail: "s 5B breach standard attributed to s 48 of the Wrongs Act 1958 (Vic) in a NSW analysis."
      detection_criterion: "Flags the Victorian Wrongs Act / wrong jurisdiction for the breach standard."
    - id: L4
      class: contradiction
      detail: "Conclusion says the operator CAN rely on s 5L and the guardrail failure IS an obvious risk, contradicting the Executive Summary (s 5L unlikely to succeed; not an obvious risk)."
      detection_criterion: "Flags the s 5L obvious-risk contradiction between summary and conclusion."
    - id: L5
      class: fabricated
      detail: "Plaintiff's medical reports confirming a permanent 18% whole-person impairment - not in the lookup context."
      detection_criterion: "Flags the 18% whole-person impairment as unsupported."

extractfacts_harper:
  variant: variants/extractfacts_harper.variant.md
  defects:
    - id: E1
      class: confab
      detail: "Riverside Gorge Tours Pty Ltd v Nguyen [2017] NSWCA 305 - nonexistent case."
      detection_criterion: "Flags Riverside Gorge Tours v Nguyen as unverifiable/likely fabricated."
    - id: E2
      class: wrongprop
      detail: "Zaluzna (1987) 162 CLR 479 (occupiers'/duty) cited as the leading authority for the three-year limitation period."
      detection_criterion: "Flags Zaluzna as misapplied for the limitation-period proposition."
    - id: E3
      class: jurisdiction
      detail: "States NSW has the Magistrates' Court of Victoria (not a Local Court) for civil PI jurisdiction."
      detection_criterion: "Flags the Magistrates' Court of Victoria / wrong jurisdiction for NSW."
    - id: E4
      class: contradiction
      detail: "Parties table: Born 1989 AND aged 28 at a 2026 incident (1989 implies ~37)."
      detection_criterion: "Flags the born-1989 vs aged-28 age inconsistency."
    - id: E5
      class: fabricated
      detail: "Mr Okafor's signed witness statement dated 5 May 2026 confirming three ignored maintenance warnings - not in the brief."
      detection_criterion: "Flags the Okafor signed statement / three prior warnings as unsupported."
